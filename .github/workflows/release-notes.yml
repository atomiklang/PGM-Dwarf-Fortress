name: Update published installer instructions
on:
  push:
    branches: [main]
    paths: ['docs/INSTALLER-RELEASE-NOTES.md', '.github/workflows/release-notes.yml']
permissions:
  contents: write
jobs:
  instructions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update beta4 instructions without replacing downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit installer-v0.1.0-beta.4 --repo "$GITHUB_REPOSITORY" --notes-file docs/INSTALLER-RELEASE-NOTES.md
