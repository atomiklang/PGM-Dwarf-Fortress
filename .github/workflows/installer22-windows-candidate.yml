name: PGM English assistant22 Windows candidate (artifacts only)
on:
  push:
    branches: [candidate/installer22-windows]
    paths: ['.github/workflows/installer22-windows-candidate.yml', 'installer/**', '.gitattributes']
permissions:
  contents: read
concurrency:
  group: installer22-windows-candidate
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'atomiklang/PGM-Dwarf-Fortress' && github.ref == 'refs/heads/candidate/installer22-windows'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: atomiklang/PGM-Dwarf-Fortress
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned builder
        run: python -m pip install pyinstaller==6.22.3
      - name: Verify source data
        run: python prepare_build.py
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Open native Windows source interface and navigation dialog
        run: python app.py --smoke-test
      - name: Check native UI layout
        run: python check_layout.py
      - name: Build Windows executable
        run: python build.py
      - name: Verify actual frozen data
        run: python verify_frozen.py
      - name: Open frozen Windows interface and package candidate
        run: python package_build.py
      - name: Record candidate evidence
        shell: pwsh
        run: |
          $record = @{ commit = '${{ github.sha }}'; runner = 'Windows Server 2022'; python = '3.12'; assistant = '0.1.0-beta.7'; native_gameplay_validated = $false; release_published = $false }
          $record | ConvertTo-Json | Out-File -Encoding utf8 release/CANDIDATE.json
          Copy-Item BUNDLE.json release/BUNDLE.json
      - uses: actions/upload-artifact@v4
        with:
          name: PGM-English-Windows-beta7-candidate-${{ github.sha }}
          path: installer/release/*
          if-no-files-found: error
          retention-days: 14
